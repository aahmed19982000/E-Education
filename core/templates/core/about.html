{% extends "base.html" %}

{% block title %}{{ t.about.title }} · {{ t.brand }}{% endblock %}

{% block content %}
  <div class="page">
    <h1>{{ t.about.title }}</h1>
    <p class="lead">{{ t.about.story }}</p>

    <div class="values-grid">
      {% for v in t.about.values %}
        <div class="value-card">
          <h4>{{ v.title }}</h4>
          <p>{{ v.desc }}</p>
        </div>
      {% endfor %}
    </div>

    <div class="about-quality">
      <p>{{ t.about.teacherQuality }}</p>
      <div class="art-box square"><span>[ {{ t.imgAboutAlt }} ]</span></div>
    </div>
  </div>
{% endblock %}
